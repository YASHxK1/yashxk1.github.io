<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The personal website of Yash Karle.">
  <title>Yash Karle</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18251f; background: #f5f7f3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 720px); padding: clamp(2rem, 7vw, 4.5rem); background: #fff; border: 1px solid #e4e9e3; border-radius: 24px; box-shadow: 0 24px 70px #16332112; }
    .eyebrow { color: #42765b; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 1rem 0; font-size: clamp(2.8rem, 8vw, 5rem); line-height: 1; letter-spacing: -.06em; }
    p { max-width: 42ch; color: #536259; font-size: 1.1rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 1.25rem; padding: .8rem 1.1rem; color: #fff; background: #245c3b; border-radius: 999px; font-weight: 650; text-decoration: none; }
    a:hover, a:focus-visible { background: #17462b; }
    footer { margin-top: 3rem; color: #78857c; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Personal website</div>
    <h1>Yash Karle</h1>
    <p>Welcome to my corner of the web. This site is a home for my work and things I choose to share.</p>
    <a href="https://github.com/YASHxK1">Find me on GitHub</a>
    <footer>Thanks for stopping by.</footer>
  </main>
</body>
</html>
